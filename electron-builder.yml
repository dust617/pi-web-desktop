appId: com.piweb.desktop
productName: Pi Web Desktop
copyright: Copyright © 2026

# GitHub Releases are created only after an explicit source/tag review. Prevent
# electron-builder from inferring a publisher from the repository metadata.
publish: null

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/pi-web/**/*
  - resources/mobile/**/*
  - resources/icon.png
  - resources/icon.ico
  - resources/icon-32.png
  - resources/tray-icon.png
  - resources/tray-icon-16.png
  - package.json

# Exclude heavy dev artifacts from the asar/app
asar: true
asarUnpack:
  - resources/pi-web/**/*

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "Pi-Web-Desktop-${version}-${arch}.${ext}"
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pi Web Desktop
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  deleteAppDataOnUninstall: false

portable:
  artifactName: "Pi-Web-Desktop-${version}-portable.${ext}"

# Do NOT bundle node_modules — pi-web has its own locked copy in resources/
npmRebuild: false
