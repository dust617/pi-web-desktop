// ─── Image attachment handling ───────────────────────────────────────────────
function handleImageFiles(files) {
  if (!files || !files.length) return;
  const imageFiles = Array.from(files).filter(f => f.type.startsWith("image/"));
  if (!imageFiles.length) return;
  // Limit to 5 images max
  const remaining = 5 - attachedImages.length;
  const toProcess = imageFiles.slice(0, Math.max(0, remaining));
  if (toProcess.length < imageFiles.length) {
    alert(`最多支持 5 张图片，已忽略 ${imageFiles.length - toProcess.length} 张`);
  }
  toProcess.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const base64 = dataUrl.split(",")[1];
      const mimeType = file.type;
      attachedImages.push({ data: base64, mimeType, previewUrl: dataUrl });
      renderImagePreviewStrip();
    };
    reader.readAsDataURL(file);
  });
  // Reset file input so same file can be selected again
  document.getElementById("imageFileInput").value = "";
}

function removeAttachedImage(index) {
  attachedImages.splice(index, 1);
  renderImagePreviewStrip();
}

function renderImagePreviewStrip() {
  const strip = document.getElementById("imagePreviewStrip");
  if (!strip) return;
  const attachBtn = document.getElementById("attachBtn");
  if (attachBtn) {
    attachBtn.classList.toggle("has-image", attachedImages.length > 0);
  }
  strip.innerHTML = attachedImages.map((img, i) =>
    `<div class="img-thumb">` +
    `<img src="${img.previewUrl}" alt="">` +
    `<button class="remove-img" onclick="removeAttachedImage(${i})">✕</button>` +
    `</div>`
  ).join("");
}

function showFullScreenImage(src) {
  const overlay = document.createElement("div");
  overlay.className = "image-viewer-overlay";
  overlay.onclick = () => overlay.remove();
  overlay.innerHTML = `<img src="${src}" alt="">`;
  document.body.appendChild(overlay);
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input?.value?.trim();
  if ((!text && !attachedImages.length) || !currentSessionId || isSending) return;
  const sessionId = currentSessionId;
  const loadId = viewLoadId;
  const imagesToSend = [...attachedImages];
  input.value = "";
  attachedImages = [];
  renderImagePreviewStrip();
  autoResize(input);
  // Optimistic update: show the user's message immediately so the phone gives
  // instant feedback instead of waiting for the SSE round-trip.
  const optimisticContent = [];
  if (text) optimisticContent.push({ type: "text", text });
  for (const img of imagesToSend) {
    optimisticContent.push({ type: "image", data: img.data, mimeType: img.mimeType });
  }
  const optimisticMessage = { role: "user", content: optimisticContent, _optimistic: true };
  currentMessages.push(optimisticMessage);
  messageRevision++;
  renderMessages();
  stickToBottom = true; clearUnseen(); scrollToBottom(true);
  setSending(true);
  try {
    await api(`/sessions/${encodeURIComponent(sessionId)}/messages`, {
      method: "POST",
      body: JSON.stringify({
        message: text || "",
        ...(imagesToSend.length ? { images: imagesToSend.map(img => ({ type: "image", data: img.data, mimeType: img.mimeType })) } : {})
      }),
    });
    // Sent OK: refresh state so the send/stop button updates promptly.
    refreshState();
  } catch (e) {
    alert("发送失败: " + e.message);
    // Remove our exact local placeholder immediately. A network refresh is only
    // a best-effort reconciliation and must not be required for rollback.
    if (currentView === "chat" && currentSessionId === sessionId && viewLoadId === loadId) {
      currentMessages = currentMessages.filter((message) => message !== optimisticMessage);
      messageRevision++;
      cacheHistory(sessionId, currentMessages);
      renderMessages();
      refreshHistory();
    }
  } finally {
    setSending(false);
  }
}

async function abortSession() {
  if (!currentSessionId) return;
  const abortBtn = document.getElementById("abortBtn");
  if (abortBtn) { abortBtn.disabled = true; abortBtn.textContent = "…"; }
  try {
    await api(`/sessions/${encodeURIComponent(currentSessionId)}/abort`, { method: "POST", body: "{}" });
    refreshState();
  } catch (e) {
    console.error("abort failed:", e);
  } finally {
    if (abortBtn) { abortBtn.disabled = false; abortBtn.textContent = "■"; }
  }
}

function onInputKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

// ─── Model selector ──────────────────────────────────────────────────
function syncModelSelect(state) {
  const trigger = document.getElementById("modelTrigger");
  const list = document.getElementById("modelList");
  const currentModel = state?.state?.model ?? state?.model;
  if (!trigger || !list || !currentModel) return;
  // Find matching option
  const options = list.querySelectorAll(".model-option");
  options.forEach(opt => {
    opt.classList.remove("selected");
    if (opt.dataset.provider === currentModel.provider && opt.dataset.modelId === currentModel.id) {
      opt.classList.add("selected");
      trigger.textContent = opt.textContent;
    }
  });
}

function populateModelSelect(modelsData, state) {
  const list = document.getElementById("modelList");
  const trigger = document.getElementById("modelTrigger");
  if (!list || !trigger) return;
  list.innerHTML = "";
  for (const m of (modelsData.models ?? [])) {
    const opt = document.createElement("div");
    opt.className = "model-option";
    opt.dataset.provider = m.provider;
    opt.dataset.modelId = m.id;
    opt.textContent = m.name || m.id;
    opt.onclick = () => selectModel(m.provider, m.id, opt);
    list.appendChild(opt);
  }
  syncModelSelect(state);
}

function toggleModelDropdown() {
  const list = document.getElementById("modelList");
  if (list) list.classList.toggle("open");
}

function closeModelDropdown() {
  const list = document.getElementById("modelList");
  if (list) list.classList.remove("open");
}

async function selectModel(provider, modelId, optionEl) {
  if (!currentSessionId) return;
  closeModelDropdown();
  if (!provider || !modelId) {
    console.warn("[mobile] model select: missing provider or modelId", { provider, modelId });
    alert("模型信息不完整，请重试");
    return;
  }
  const trigger = document.getElementById("modelTrigger");
  const priorText = trigger?.textContent || "";
  if (trigger) trigger.textContent = optionEl.textContent;
  try {
    console.log("[mobile] switching model:", { provider, modelId });
    await api(`/sessions/${encodeURIComponent(currentSessionId)}/model`, {
      method: "POST",
      body: JSON.stringify({ provider, modelId }),
    });
    await refreshState();
  } catch (e) {
    if (trigger) trigger.textContent = priorText;
    const errorMsg = e.message || "未知错误";
    console.error("[mobile] model switch failed:", { provider, modelId, error: errorMsg, stack: e.stack });
    alert(`模型切换失败: ${errorMsg}\n\n模型: ${provider}/${modelId}`);

// ─── Theme (day/night) ───────────────────────────────────────

let _themeTapLock = 0;
function toggleTheme() {

  // quick succession reads as a "white flash then revert" on touch screens).
  const now = Date.now();

// ─── Completion notify (vibrate + chime) ────────────────────────────
let _audioCtx = null;
function notifyDone() {
  // Vibrate (Android; iOS Safari ignores unless user-gesture primed — harmless).
  try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch {}
  // Short two-note chime via WebAudio (no asset needed).
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    const now = ctx.currentTime;
    [[880, 0, 0.12], [1320, 0.13, 0.18]].forEach(([freq, off, dur]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + off);
      gain.gain.exponentialRampToValueAtTime(0.18, now + off + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + off + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + off);
      osc.stop(now + off + dur + 0.05);
    });
  } catch {}
}

// ─── Smart auto-scroll ───────────────────────────────────────────────
// Follow new content only while the user is at (or near) the bottom. If they
// scroll up to read history we stop yanking them down and instead surface a
// "↓ 新消息" button; auto-follow resumes the moment they return to the bottom
// or tap that button.
let stickToBottom = true;
let unseenNew = false;
let lastUserQuestion = "";          // latest user prompt; shown as a sticky anchor when scrolling up
let lastUserQuestionOwner = "";     // sessionId that lastUserQuestion was derived from (anti-stale guard)
let scrollGraceUntil = 0;           // epoch ms; while now<this, force stick-to-bottom after entry
let forcedScrollTimer = null;
let chatResizeObs = null;           // pins to bottom on late content growth while stickToBottom
const STICK_THRESHOLD = 90; // px from bottom that still counts as "at bottom"

function isNearBottom() {
  const c = document.getElementById("content");
  if (!c) return true;
  return c.scrollHeight - c.scrollTop - c.clientHeight < STICK_THRESHOLD;
}

function scrollToBottom(force = false, markNew = true) {
  const c = document.getElementById("content");
  if (!c) return;
  if (!force && !stickToBottom) {
    if (markNew) markUnseen(); // don't grab the reader; only flag real new content
    return;
  }
  // Robust pin: a single rAF can fire before the long thread's first-screen
  // layout has settled (fonts / a tall block), reading a too-small scrollHeight
  // and leaving the view stranded mid-thread. Double rAF + a delayed fallback
  // for forced scrolls cover the layout jitter; the ResizeObserver below covers
  // any growth that happens after that.
  const sessionId = currentSessionId;
  const loadId = viewLoadId;
  const pin = () => {
    if (currentView !== "chat" || currentSessionId !== sessionId || viewLoadId !== loadId) return;
    c.scrollTop = c.scrollHeight;
  };
  if (force) {
    requestAnimationFrame(() => { pin(); requestAnimationFrame(pin); });
    if (forcedScrollTimer) clearTimeout(forcedScrollTimer);
    forcedScrollTimer = setTimeout(() => {
      forcedScrollTimer = null;
      if (currentView === "chat" && currentSessionId === sessionId && viewLoadId === loadId) pin();
    }, 160);
  } else {
    requestAnimationFrame(pin);
  }
}

function markUnseen() {
  if (currentView !== "chat") return;
  unseenNew = true;
  const b = document.getElementById("jumpBtn");
  if (b) b.style.display = "";
}

function clearUnseen() {
  unseenNew = false;
  const b = document.getElementById("jumpBtn");
  if (b) b.style.display = "none";
}

// ── Custom scrollbar controller ──────────────────────────────────────
let _railHideT = null;
let _scrollUiTimer = null;
function updateScrollThumb() {
  const c = document.getElementById("content");
  const rail = document.getElementById("scrollRail");
  const thumb = document.getElementById("scrollThumb");
  if (!c || !rail || !thumb) return;
  const max = c.scrollHeight - c.clientHeight;
  if (max <= 4) { rail.style.display = "none"; return; } // nothing to scroll
  rail.style.display = "";
  const railH = rail.clientHeight;
  if (railH <= 0) return;
  const ratio = c.clientHeight / c.scrollHeight;
  const minThumb = Number.parseFloat(getComputedStyle(thumb).minHeight) || 44;
  const thumbH = Math.max(minThumb, ratio * railH);
  const travel = railH - thumbH;
  const top = travel > 0 ? (c.scrollTop / max) * travel : 0;
  thumb.style.height = thumbH + "px";
  thumb.style.transform = "translateY(" + top + "px)";
}
function showScrollRail() {
  const rail = document.getElementById("scrollRail");
  if (!rail || rail.style.display === "none") return;
  rail.classList.add("show");
  if (_railHideT) clearTimeout(_railHideT);
  _railHideT = setTimeout(() => rail.classList.remove("show"), 900);
}
function refreshScrollUI() { updateScrollThumb(); showScrollRail(); }
function scheduleScrollUI(show = false) {
  if (_scrollUiTimer) return;
  _scrollUiTimer = setTimeout(() => {
    _scrollUiTimer = null;
    updateScrollThumb();
    if (show) showScrollRail();
  }, 100);
}

function onContentScroll() {
  // During the post-entry grace window we ignore a transient isNearBottom()=false
  // caused by layout settling, so a freshly opened thread can't get stuck mid-way
  // (and so streaming keeps following until the user deliberately scrolls up).
  stickToBottom = isNearBottom() || Date.now() < scrollGraceUntil;
  if (stickToBottom) clearUnseen();
  updateContextAnchor();
  refreshScrollUI();
}

function jumpToBottom() {
  stickToBottom = true;
  clearUnseen();
  scrollToBottom(true);
  updateContextAnchor();
}

function refreshLastUserQuestion() {
  let q = "";
  for (let i = currentMessages.length - 1; i >= 0; i--) {
    if (currentMessages[i]?.role === "user") { q = extractText(currentMessages[i].content).trim(); break; }
  }
  lastUserQuestion = q.length > 200 ? q.slice(0, 200) + "…" : q;
  // Tag the question with the session it came from so updateContextAnchor can
  // refuse to show a question that belongs to a different (previous) session.
  lastUserQuestionOwner = currentSessionId;
}

// Sticky "what are we discussing" anchor: shows the latest user prompt pinned
// to the top while the user scrolls UP through history (hidden at the bottom,
// where the live conversation is already in view). Solves "I scroll back to
// check something and forget what the current question was".
function updateContextAnchor() {
  const el = document.getElementById("ctxAnchor");
  if (!el) return;
  // Owner check is the real fix for the cross-session leak: a question computed
  // from session X's messages must never render while we are viewing session Y,
  // even for the brief window between navigate() and Y's history rendering.
  if (currentView !== "chat" || !lastUserQuestion || lastUserQuestionOwner !== currentSessionId) { el.style.display = "none"; return; }
  const t = "💬 " + lastUserQuestion;
  if (el.textContent !== t) el.textContent = t;
  el.style.display = stickToBottom ? "none" : "";
}

function esc(s) {
  if (!s) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function timeAgo(iso) {
  if (!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "刚刚";
  if (mins < 60) return `${mins}分钟前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}小时前`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}天前`;
  return new Date(iso).toLocaleDateString("zh-CN");
}

// ─── Keyboard / viewport adaptation ────────────────────────────────
// With `interactive-widget=resizes-content` the layout viewport shrinks when
// the on-screen keyboard opens, so the flex layout reflows and the input bar
// sits above the keyboard. These handlers additionally keep the latest message
// visible while typing.
// ─── Zoom limit (not lock) ──────────────────────────────────────────
// Pinch / Ctrl-wheel zoom is bounded DECLARATIVELY by the viewport meta tag
// (maximum-scale=2.5, user-scalable=yes) on browsers that honour it — that
// covers Android Chrome and most desktop browsers, which is where the "zoom
// deforms the layout" report came from. We intentionally do NOT add a runtime
// CSS-`zoom` compensation layer here: on iOS Safari the `zoom` property has no
// effect (and iOS ignores maximum-scale by design, but its native pinch-zoom
// scales the whole viewport without breaking the flexbox layout, so no
// deformation occurs), and on desktop a CSS-`zoom` clamp would cancel the
// user's intentional Ctrl+wheel zoom and could fight the dvh/visualViewport
// math — i.e. cause the very deformation we are avoiding. Native pinch-zoom
// also cannot shrink below 1x, so "infinite shrink" is impossible, and
// `text-size-adjust:100%` (see CSS) stops OS font-scaling from reflowing the
// layout. Net: zoom stays within sane bounds where the platform allows, never
// deforms, and always returns cleanly to 1x.
function setupZoomLimit() {
  // no-op: bounds are enforced via the viewport meta + text-size-adjust.
  // Kept as a named hook for future platform-specific needs.
}

function setupViewportHandling() {
  const vv = window.visualViewport;
  const inputArea = document.getElementById("inputArea");
  const syncViewportMetrics = () => {
    // Android browser chrome and keyboards do not report 100vh/100dvh
    // consistently. visualViewport.height is the actually visible CSS-pixel
    // height, so use it as the final layout authority when available.
    const height = Math.round(vv?.height ?? window.innerHeight);
    if (height > 0) document.documentElement.style.setProperty("--app-height", `${height}px`);
    if (inputArea && inputArea.offsetHeight > 0) {
      document.documentElement.style.setProperty("--input-area-height", `${inputArea.offsetHeight}px`);
    }
  };
  syncViewportMetrics();
  vv?.addEventListener("resize", () => {
    syncViewportMetrics();
    const msgInput = document.getElementById("msgInput");
    // Respect an intentional upward scroll even when the keyboard resizes the
    // viewport. Auto-follow continues only if the reader was already at bottom.
    if (currentView === "chat" && msgInput && document.activeElement === msgInput) {
      requestAnimationFrame(() => scrollToBottom());
    }
  });
  window.addEventListener("resize", syncViewportMetrics);
  if (inputArea && "ResizeObserver" in window) {
    new ResizeObserver(syncViewportMetrics).observe(inputArea);
  }
  const msgInput = document.getElementById("msgInput");
  if (msgInput) {
    msgInput.addEventListener("focus", () => {
      // Give the keyboard animation a moment, but never yank a reader who has
      // intentionally scrolled upward.
      setTimeout(() => { if (currentView === "chat") scrollToBottom(); }, 300);
    });
  }
}

// ─── Tap outside to dismiss menus / keyboard ────────────────────────
// Native <select> popovers and the on-screen keyboard stay open on some
// devices after tapping elsewhere. Blur the focused control when the user
// taps a non-interactive area so dropdowns collapse and the keyboard hides.
function setupTapOutside() {
  document.addEventListener("pointerdown", (e) => {
    const t = e.target;
    if (t && t.closest && t.closest("input, textarea, select, button, a, .list-item")) return;
    const active = document.activeElement;
    if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA" || active.tagName === "SELECT")) {
      active.blur();
    }
  }, { passive: true });
}

// ─── Wake Lock ──────────────────────────────────────────────────────
// Keep the screen on for 5 minutes when the app is in the foreground.
let wakeLock = null;
let wakeLockTimer = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    console.log('[mobile] Wake Lock acquired');
    wakeLock.addEventListener('release', () => {
      console.log('[mobile] Wake Lock released');
    });
    // Auto-release after 5 minutes
    if (wakeLockTimer) clearTimeout(wakeLockTimer);
    wakeLockTimer = setTimeout(() => {
      releaseWakeLock();
    }, 5 * 60 * 1000);
  } catch (err) {
    console.warn('[mobile] Wake Lock failed:', err);
  }
}
function releaseWakeLock() {
  if (wakeLockTimer) {
    clearTimeout(wakeLockTimer);
    wakeLockTimer = null;
  }
  if (wakeLock) {
    wakeLock.release();
    wakeLock = null;
  }
}
function setupWakeLock() {
  // Request wake lock when page becomes visible
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      requestWakeLock();
    } else {
      releaseWakeLock();
    }
  });
  // Initial request if already visible
  if (document.visibilityState === 'visible') {
    requestWakeLock();
  }
}

// ─── Browser Back Intercept ─────────────────────────────────────────
function setupBrowserBackIntercept() {
  resetBrowserNavigationRoot();
  window.addEventListener("popstate", (e) => {
    browserBackPending = false;
    browserBackToken++;
    if (browserBackTimer) { clearTimeout(browserBackTimer); browserBackTimer = null; }
    const state = e.state;
    // A previous document or a state from an old auth/root epoch: keep the
    // current root in place instead of falling through to a blank history page.
    if (state?.app !== NAV_STATE_KEY || state.epoch !== navEpoch) {
      history.pushState(makeBrowserHistoryState(viewStack.length, true), "");
      return;
    }

    const targetDepth = Math.max(0, Number(state.depth) || 0);
    const currentDepth = viewStack.length;
    if (targetDepth < currentDepth) {
      if (!restoreBrowserRoute(state, "back")) {
        while (viewStack.length > targetDepth) applyAppBack(viewStack.length - targetDepth === 1);
      }
      return;
    }

    // The duplicate depth-0 entry is the root guard. Re-arm it only at root;
    // never add guard entries during normal app navigation.
    if (targetDepth === 0 && currentDepth === 0) {
      history.pushState(makeBrowserHistoryState(0, true), "");
      return;
    }

    // Browser Forward restores the route snapshot saved in that history entry.
    if (targetDepth > currentDepth) {
      if (!restoreBrowserRoute(state, "forward")) {
        history.replaceState(makeBrowserHistoryState(currentDepth), "");
      }
    }
  });
}

// ─── Swipe Back Gesture ─────────────────────────────────────────────
function setupSwipeBackGesture() {
  let startX = 0;
  let startY = 0;
  let tracking = false;
  let horizontal = false;
  let lastDeltaX = 0;
  let indicator = null;
  const EDGE_WIDTH = 72;
  const TRIGGER_DISTANCE = 76;

  function getIndicator() {
    if (!indicator) {
      indicator = document.createElement("div");
      indicator.className = "swipe-back-indicator";
      indicator.textContent = "← 返回";
      document.body.appendChild(indicator);
    }
    return indicator;
  }

  function paint(deltaX) {
    const el = getIndicator();
    const progress = Math.max(0, Math.min(deltaX / TRIGGER_DISTANCE, 1));
    el.classList.add("swiping");
    el.classList.toggle("ready", progress >= 1);
    el.textContent = progress >= 1 ? "松开返回" : "← 返回";
    el.style.opacity = String(0.2 + progress * 0.8);
    el.style.transform = `translate3d(${-64 + progress * 72}px,-50%,0) scale(${0.88 + progress * 0.12})`;
  }

  function hideIndicator(delay = 0) {
    if (!indicator) return;
    setTimeout(() => {
      indicator.classList.remove("swiping", "ready");
      indicator.style.opacity = "0";
      indicator.style.transform = "translate3d(-64px,-50%,0) scale(0.88)";
      indicator.textContent = "← 返回";
    }, delay);
  }

  function cancelGesture() {
    tracking = false;
    horizontal = false;
    lastDeltaX = 0;
    hideIndicator();
  }

  document.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) {
      if (tracking) cancelGesture();
      return;
    }
    if (viewStack.length === 0 || browserBackPending) return;
    const touch = e.touches[0];
    if (touch.clientX > EDGE_WIDTH) return;
    startX = touch.clientX;
    startY = touch.clientY;
    lastDeltaX = 0;
    tracking = true;
    horizontal = false;
  }, { passive: true });

  document.addEventListener("touchmove", (e) => {
    if (!tracking) return;
    if (e.touches.length !== 1) {
      cancelGesture();
      return;
    }
    const touch = e.touches[0];
    const deltaX = touch.clientX - startX;
    const deltaY = Math.abs(touch.clientY - startY);
    if (!horizontal) {
      if (deltaX < 0 || (deltaY > 12 && deltaY >= deltaX)) {
        cancelGesture();
        return;
      }
      if (deltaX < 8 || deltaX <= deltaY * 1.2) return;
      horizontal = true;
    }
    e.preventDefault();
    lastDeltaX = deltaX;
    paint(deltaX);
  }, { passive: false });

  document.addEventListener("touchend", (e) => {
    if (!tracking) return;
    if (e.touches.length !== 0) {
      cancelGesture();
      return;
    }
    const shouldBack = horizontal && lastDeltaX >= TRIGGER_DISTANCE && viewStack.length > 0;
    tracking = false;
    horizontal = false;
    if (shouldBack) {
      paint(TRIGGER_DISTANCE);
      try { navigator.vibrate?.(20); } catch {}
      goBack();
      hideIndicator(140);
    } else {
      hideIndicator();
    }
    lastDeltaX = 0;
  }, { passive: true });
  document.addEventListener("touchcancel", cancelGesture, { passive: true });
}

// ─── Pull-to-refresh ────────────────────────────────────────────────
// Allows users to pull down on the session/project list to refresh.
function setupPullToRefresh() {
  const content = document.getElementById("content");
  const indicator = document.getElementById("pullRefreshIndicator");
  if (!content || !indicator) return;

  let startX = 0;
  let startY = 0;
  let lastDeltaY = 0;
  let tracking = false;
  let pulling = false;
  let refreshing = false;
  let feedbackTimer = null;
  const PULL_THRESHOLD = 68;

  function hidePullIndicator(delay = 0) {
    if (feedbackTimer) clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
      feedbackTimer = null;
      indicator.classList.remove("visible", "refreshing");
      indicator.style.opacity = "";
      indicator.style.transform = "";
      indicator.textContent = "↓ 下拉刷新";
    }, delay);
  }

  function cancelPull() {
    tracking = false;
    pulling = false;
    lastDeltaY = 0;
    if (!refreshing) hidePullIndicator();
  }

  content.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1 || refreshing) return;
    if (currentView !== "projects" && currentView !== "sessions") return;
    if (content.scrollTop > 1) return;
    if (feedbackTimer) { clearTimeout(feedbackTimer); feedbackTimer = null; }
    const touch = e.touches[0];
    startX = touch.clientX;
    startY = touch.clientY;
    lastDeltaY = 0;
    tracking = true;
    pulling = false;
  }, { passive: true });

  content.addEventListener("touchmove", (e) => {
    if (!tracking || refreshing) return;
    if (e.touches.length !== 1) {
      cancelPull();
      return;
    }
    const touch = e.touches[0];
    const deltaX = Math.abs(touch.clientX - startX);
    const deltaY = touch.clientY - startY;
    if (deltaY <= 0 || (deltaX > 12 && deltaX >= deltaY)) {
      cancelPull();
      return;
    }
    if (content.scrollTop > 1) {
      cancelPull();
      return;
    }
    if (deltaY < 6) return;

    // Once the gesture is clearly downward, take ownership from Android's
    // native overscroll so touchend is delivered reliably.
    pulling = true;
    lastDeltaY = deltaY;
    e.preventDefault();
    const progress = Math.min(deltaY / PULL_THRESHOLD, 1);
    indicator.classList.add("visible");
    indicator.style.opacity = String(0.25 + progress * 0.75);
    indicator.style.transform = `translateY(${Math.min(10, deltaY * 0.1)}px)`;
    indicator.textContent = progress >= 1 ? "↑ 松开刷新" : "↓ 下拉刷新";
  }, { passive: false });

  content.addEventListener("touchend", async (e) => {
    if (!tracking || refreshing) return;
    if (e.touches.length !== 0) {
      cancelPull();
      return;
    }
    const shouldRefresh = pulling && lastDeltaY >= PULL_THRESHOLD;
    tracking = false;
    pulling = false;
    lastDeltaY = 0;
    indicator.style.opacity = "";
    indicator.style.transform = "";

    if (!shouldRefresh) {
      hidePullIndicator();
      return;
    }

    refreshing = true;
    const startedAt = Date.now();
    let succeeded = true;
    indicator.textContent = "刷新中…";
    indicator.classList.add("visible", "refreshing");
    try {
      if (currentView === "projects") {
        await showProjects(true);
      } else if (currentView === "sessions") {
        await showSessions(currentProjectId, true);
      }
    } catch (e) {
      succeeded = false;
      console.warn("[mobile] pull-to-refresh failed:", e);
    } finally {
      const remaining = Math.max(0, 450 - (Date.now() - startedAt));
      if (remaining) await new Promise((resolve) => setTimeout(resolve, remaining));
      refreshing = false;
      indicator.classList.remove("refreshing");
      indicator.textContent = succeeded ? "✓ 已刷新" : "刷新失败，请重试";
      hidePullIndicator(650);
    }
  }, { passive: true });

  content.addEventListener("touchcancel", cancelPull, { passive: true });
}

// ─── Init ────────────────────────────────────────────────────────────
(async function init() {
  // Register service worker with automatic, no-cache-clear updates.
  // PWA_VERSION must match VERSION in sw.js; bump BOTH on every deploy.
  // Updates are applied SILENTLY in the background: the new SW takes over via
  // skipWaiting+claim and the network-first shell serves the fresh version on
  // the next cold launch. We never reload the live page here — doing so mid-
  // session wiped chat state and dropped users to the project list (the
  // "auto-refresh / dropped and re-entered" instability).
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/mobile/sw.js", { updateViaCache: "none" }).then((reg) => {
      navigator.serviceWorker.addEventListener("message", (e) => {
        const d = e.data;
        if (d && d.type === "sw-version") {
          if (d.version && d.version !== PWA_VERSION) {
            // This page is a stale shell while a fresh SW is active. Reloading
            // is SAFE outside chat (login/projects/sessions have nothing to
            // lose), so pick up the new shell immediately instead of waiting for
            // the user's next cold launch — this is what actually delivers a
            // theme/colour fix to an already-open PWA. Guarded once per version
            // via sessionStorage so it can never loop. Inside chat we still
            // defer to the next cold launch to avoid dropping the conversation.
            let reloadedFor = "";
            try { reloadedFor = sessionStorage.getItem("piReloadedFor") || ""; } catch {}
            if (currentView !== "chat" && reloadedFor !== d.version) {
              try { sessionStorage.setItem("piReloadedFor", d.version); } catch {}
              console.info("[sw] stale shell", PWA_VERSION, "-> reloading to", d.version);
              window.location.reload();
              return;
            }
            console.info("[sw] newer shell", d.version, "active (page", PWA_VERSION + "); applies on next launch, no reload");
          }
        }
      });
      // When a freshly-installed SW takes control mid-session, re-ask its
      // version so the stale-shell check above runs again (the initial
      // get-version went to the OLD controller and reported the old version).
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage("get-version");
        }
      });
      // Ask the active SW for its version (covers the case where it activated
      // before this page attached its listener).
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage("get-version");
      }
      // Check for updates when the app becomes visible and every few minutes,
      // instead of waiting for the browser's 24h default SW update check.
      const checkUpdate = () => reg.update().catch(() => {});
      checkUpdate(); // do not wait for visibilitychange or the five-minute timer
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") checkUpdate();
      });
      setInterval(checkUpdate, 5 * 60 * 1000);
    }).catch(() => {});
  }
  setupZoomLimit();
  setupViewportHandling();
  setupTapOutside();
  setupPullToRefresh();
  setupWakeLock();
  setupBrowserBackIntercept();
  setupSwipeBackGesture();

  // Reconnect the SSE stream after the OS suspends the tab or the network
  // switches (WiFi<->cellular). Without this, a frozen EventSource can stay
  // silently dead on wake, leaving the chat stuck until a manual refresh.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") wakeSSE();
  });
  window.addEventListener("online", wakeSSE);
  const contentEl = document.getElementById("content");
  if (contentEl) contentEl.addEventListener("scroll", onContentScroll, { passive: true });
  // Custom scrollbar wiring: drag the thumb, click the rail to jump a page, and
  // keep the thumb in sync via a MutationObserver (content changes, incl. live
  // streaming tokens) + ResizeObserver (container resizes / keyboard). This is
  // what gives Android a scrollbar that is visible on demand AND draggable — the
  // native overlay is neither, which is why the old one looked "broken".
  (function wireCustomScrollbar() {
    const rail = document.getElementById("scrollRail");
    const thumb = document.getElementById("scrollThumb");
    const c = document.getElementById("content");
    if (!rail || !thumb || !c) return;
    let drag = false, startY = 0, startTop = 0;
    thumb.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      drag = true; rail.classList.add("dragging");
      try { thumb.setPointerCapture(e.pointerId); } catch {}
      startY = e.clientY; startTop = c.scrollTop;
    });
    thumb.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const railH = rail.clientHeight, thumbH = thumb.offsetHeight;
      const travel = railH - thumbH, max = c.scrollHeight - c.clientHeight;
      if (travel <= 0 || max <= 0) return;
      c.scrollTop = startTop + (e.clientY - startY) * (max / travel);
    });
    const endDrag = (e) => {
      if (!drag) return; drag = false; rail.classList.remove("dragging");
      try { thumb.releasePointerCapture(e.pointerId); } catch {}
      showScrollRail();
    };
    thumb.addEventListener("pointerup", endDrag);
    thumb.addEventListener("pointercancel", endDrag);
    rail.addEventListener("pointerdown", (e) => {
      if (e.target === thumb) return; // the thumb handles its own drag
      const rect = rail.getBoundingClientRect();
      const max = c.scrollHeight - c.clientHeight;
      if (max <= 0) return;
      const ratio = (e.clientY - rect.top) / rect.height;
      c.scrollTop = Math.max(0, Math.min(max, ratio * c.scrollHeight - c.clientHeight / 2));
      showScrollRail();
    });
    if ("ResizeObserver" in window) new ResizeObserver(() => updateScrollThumb()).observe(c);
    if ("MutationObserver" in window) {
      // Child-list changes cover view/list replacement. Streaming code schedules
      // thumb updates directly, so observing every character mutation would only
      // duplicate layout reads on long replies.
      new MutationObserver(() => scheduleScrollUI(false))
        .observe(c, { childList: true, subtree: true });
    }
  })();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (currentView === "projects") showProjects(true);
    else if (currentView === "sessions") showSessions(currentProjectId, true);
    else if (currentView === "chat") { refreshHistory(); refreshState(); }
  });

  // ── Long-press header title to copy session ID ───────────────────
  let _headerLPTimer = null;
  const _header = document.getElementById("header");
  if (_header) {
    _header.addEventListener("touchstart", (e) => {
      const t = e.target;
      if (!t || !t.closest || !t.closest(".header .title")) return;
      _headerLPTimer = setTimeout(() => {
        _headerLPTimer = null;
        if (currentView === "chat" && currentSessionId) {
          copySessionIdToast(currentSessionId);
        }
      }, 500);
    }, { passive: true });
    _header.addEventListener("touchend", () => { if (_headerLPTimer) { clearTimeout(_headerLPTimer); _headerLPTimer = null; } });
    _header.addEventListener("touchmove", () => { if (_headerLPTimer) { clearTimeout(_headerLPTimer); _headerLPTimer = null; } });
    _header.addEventListener("touchcancel", () => { if (_headerLPTimer) { clearTimeout(_headerLPTimer); _headerLPTimer = null; } });
  }

  function copySessionIdToast(id) {
    try { navigator.clipboard.writeText(id).catch(() => {}); } catch {}
    const old = document.querySelector(".toast-msg");
    if (old) old.remove();
    const t = document.createElement("div");
    t.className = "toast-msg";
    t.textContent = "\u2705 \u4f1a\u8bddID\u5df2\u590d\u5236";
    document.body.appendChild(t);
    try { if (navigator.vibrate) navigator.vibrate(30); } catch {}
    setTimeout(() => { if (t.parentNode) t.remove(); }, 2000);
  }
  // Check if already authenticated
  try {
    await api("/projects");
    currentView = "projects";
    viewStack = [];
    resetBrowserNavigationRoot();
    renderView();
  } catch {
    showLogin();
  }
})();
</script>
